<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Orange — Full Line, Ball to Middle, Hooker on Back Peel | 7-Man Lineout</title>
<style>
  :root{
    --pitch:#1f5c38;
    --pitch-line:#eef3ec;
    --attack:#1b3a5c;
    --attack-light:#3a6ea5;
    --defense:#7a2e2e;
    --ball:#a9712f;
    --accent:#e8a33d;
    --ink:#0f1b14;
    --panel:#16241b;
    --panel-2:#1d3024;
    --paper:#f4f1ea;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--ink);
    font-family:'Bahnschrift','Segoe UI Semibold','Arial Narrow',system-ui,sans-serif;
    color:var(--paper);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:24px 14px 40px;
  }
  h1{
    font-size:clamp(20px,4vw,30px);
    letter-spacing:0.5px;
    margin:0 0 2px;
    text-transform:uppercase;
    font-weight:800;
  }
  .sub{
    color:#9fb3a4;
    font-size:13px;
    margin-bottom:18px;
    letter-spacing:0.4px;
  }
  .stage{
    width:100%;
    max-width:940px;
    background:var(--panel);
    border:1px solid #2a3c30;
    border-radius:10px;
    overflow:hidden;
  }
  .pitch-wrap{
    background:var(--pitch);
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.025) 0 40px, rgba(0,0,0,0.02) 40px 80px);
    position:relative;
  }
  svg{display:block; width:100%; height:auto;}
  .ticker{
    background:var(--panel-2);
    border-top:1px solid #2a3c30;
    border-bottom:1px solid #2a3c30;
    padding:10px 16px;
    display:flex;
    align-items:baseline;
    gap:10px;
  }
  .ticker .step-num{
    background:var(--accent);
    color:#1b1402;
    font-weight:800;
    font-size:13px;
    padding:2px 8px;
    border-radius:3px;
    letter-spacing:0.5px;
  }
  .ticker .step-title{
    font-weight:800;
    font-size:15px;
    text-transform:uppercase;
    letter-spacing:0.4px;
  }
  .ticker .step-note{
    color:#c7d6cc;
    font-size:13px;
    margin-left:auto;
    text-align:right;
    max-width:55%;
  }
  .controls{
    display:flex;
    align-items:center;
    gap:8px;
    padding:14px 16px 18px;
    flex-wrap:wrap;
  }
  button{
    background:var(--attack);
    color:var(--paper);
    border:1px solid var(--attack-light);
    padding:9px 14px;
    border-radius:6px;
    font-size:13px;
    font-weight:700;
    letter-spacing:0.3px;
    cursor:pointer;
    text-transform:uppercase;
    transition:background 0.15s ease;
  }
  button:hover{background:var(--attack-light);}
  button.primary{
    background:var(--accent);
    color:#1b1402;
    border-color:var(--accent);
  }
  button.primary:hover{filter:brightness(1.08);}
  button:disabled{opacity:0.35; cursor:default;}
  .dots{
    display:flex;
    gap:6px;
    margin-left:4px;
  }
  .dot{
    width:8px;height:8px;border-radius:50%;
    background:#3a4d40;
    cursor:pointer;
  }
  .dot.active{background:var(--accent);}
  .legend{
    display:flex;
    gap:18px;
    padding:0 16px 18px;
    font-size:12px;
    color:#9fb3a4;
    flex-wrap:wrap;
  }
  .legend span{display:inline-flex; align-items:center; gap:6px;}
  .swatch{width:10px;height:10px;border-radius:50%;display:inline-block;}
</style>
</head>
<body>

<h1>Orange — Full Line, Ball to Middle, Hooker with a Back Peel</h1>
<div class="sub">7-MAN LINEOUT · DUMMY JUMP AT FRONT, BALL TO MIDDLE JUMPER WHO SETS UP HOOKER ON PEEL</div>

<div class="stage">
  <div class="pitch-wrap">
    <svg id="pitch" viewBox="0 220 1000 580" xmlns="http://www.w3.org/2000/svg">
      <!-- Touchline -->
      <line x1="60" y1="20" x2="60" y2="780" stroke="#eef3ec" stroke-width="3"/>
      <text x="38" y="500" fill="#eef3ec" font-size="11" font-weight="700" transform="rotate(-90 38 500)" opacity="0.8">TOUCHLINE</text>

      <!-- 5m line -->
      <line x1="240" y1="20" x2="240" y2="780" stroke="#eef3ec" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.5"/>
      <text x="243" y="234" fill="#eef3ec" font-size="10" opacity="0.6">5M</text>

      <!-- 15m line -->
      <line x1="600" y1="20" x2="600" y2="780" stroke="#eef3ec" stroke-width="1.5" stroke-dasharray="6 6" opacity="0.5"/>
      <text x="603" y="234" fill="#eef3ec" font-size="10" opacity="0.6">15M</text>

      <!-- gap guide -->
      <line x1="60" y1="660" x2="600" y2="660" stroke="#ffffff" stroke-width="0.5" opacity="0.15"/>

      <!-- direction arrow: attack -->
      <text x="750" y="775" fill="#9fb3a4" font-size="11" font-weight="700" letter-spacing="1">FIELD →</text>

      <!-- Movement arrows layer (drawn dynamically) -->
      <g id="arrows"></g>

      <!-- Ball trail -->
      <path id="ball-trail" d="" stroke="var(--accent)" stroke-width="2" fill="none" stroke-dasharray="4 5" opacity="0"/>

      <!-- Defense players (static, mirrored row) -->
      <g id="defense"></g>

      <!-- Attack players -->
      <g id="attack"></g>

      <!-- Ball -->
      <ellipse id="ball" cx="60" cy="660" rx="7" ry="5" fill="var(--ball)" stroke="#1b1402" stroke-width="1"/>
    </svg>
  </div>

  <div class="ticker">
    <span class="step-num" id="step-num">1/7</span>
    <span class="step-title" id="step-title">Set the line</span>
    <span class="step-note" id="step-note"></span>
  </div>

  <div class="controls">
    <button id="prev">◀ Back</button>
    <button id="playpause" class="primary">▶ Play</button>
    <button id="next">Next ▶</button>
    <button id="reset">Reset</button>
    <div class="dots" id="dots"></div>
  </div>

  <div class="legend">
    <span><i class="swatch" style="background:var(--attack)"></i> Attacking forwards</span>
    <span><i class="swatch" style="background:var(--accent)"></i> Planned catcher</span>
    <span><i class="swatch" style="background:var(--attack-light)"></i> Scrum-half / Fly-half / Thrower / Backs</span>
    <span><i class="swatch" style="background:var(--defense)"></i> Defending line</span>
    <span><i class="swatch" style="background:var(--ball)"></i> Ball</span>
  </div>
</div>

<script>
const NS = "http://www.w3.org/2000/svg";

// Attack roster — full 7-man line: 1, 4, 3, 8, 6, 5, 7 down L1-L7.
// 8 is the planned catcher (real target). 11 and 12 are static starting markers only.
const attackRoster = [
  {id:'P1', label:'1', role:'Starts L1 — fronts the dummy lift, then flanks the real one'},
  {id:'P4', label:'4', role:'Starts L2 — the dummy target, then flanks the real lift'},
  {id:'P3', label:'3', role:'Starts L3 — fronts the dummy, then the real lifter'},
  {id:'P8', label:'8', role:'Starts L4 — real target, catches and pops it to 2'},
  {id:'P6', label:'6', role:'Starts L5 — the other real lifter'},
  {id:'P5', label:'5', role:'Starts L6 — flanks the real lift on the back side'},
  {id:'P7', label:'7', role:'Starts L7 — flanks the real lift on the back side'},
  {id:'SH', label:'9', role:'Scrum-half (S2)'},
  {id:'FH', label:'10', role:'Fly-half (standard)'},
  {id:'TH', label:'2', role:'Thrower — peels around the back with the ball'},
  {id:'WNG', label:'11', role:'Starts halfway between the 5m line and touchline'},
  {id:'CTR', label:'12', role:'Starts 5m infield of 10, 3m further back'},
];

const defenseRoster = [
  {id:'X1', label:'1'},
  {id:'X2', label:'4'},
  {id:'X3', label:'5'},
  {id:'X4', label:'8'},
  {id:'X5', label:'2'},
  {id:'X6', label:'6'},
  {id:'X7', label:'7'},
];

const defensePos = {
  X1:[240,722], X2:[300,722], X3:[360,722], X4:[420,722], X5:[480,722], X6:[540,722], X7:[600,722]
};

const steps = [
  {
    title: "Set the line",
    note: "Personnel run 1-4-3-8-6-5-7 down the line. 2 lines up on the touchline, aligned with the middle of the channel — that's where the ball and the jump are both aimed. 9 sets at S2.",
    pos: {
      TH:[60,675], P1:[240,640], P4:[300,640], P3:[360,640], P8:[420,640], P6:[480,640], P5:[540,640], P7:[600,640],
      SH:[330,532], FH:[744,370], WNG:[150,370], CTR:[924,262]
    },
    ball:[60,675],
    arrow:null
  },
  {
    title: "Dummy lift on 4",
    note: "1 and 3 step in on 4 to fake a lift — total decoy, there's nobody really coming here.",
    pos: {
      TH:[60,675], P1:[260,646], P4:[300,660], P3:[340,646], P8:[420,640], P6:[480,640], P5:[540,640], P7:[600,640],
      SH:[330,532], FH:[744,370], WNG:[150,370], CTR:[924,262]
    },
    ball:[60,675],
    arrow:null
  },
  {
    title: "Real lift sets on 8",
    note: "1 and 4 hold exactly where they were for the dummy. 3 and 6 are set either side of 8, who's now up to the same height 4 reached in the dummy — closing in on the channel.",
    pos: {
      TH:[60,675], P1:[260,646], P4:[300,660], P3:[383,646], P8:[420,660], P6:[458,646], P5:[540,640], P7:[600,640],
      SH:[330,532], FH:[744,370], WNG:[150,370], CTR:[924,262]
    },
    ball:[60,675],
    arrow:null
  },
  {
    title: "Throw released — 8 rises, maul decoy forms",
    note: "2 throws it straight down the channel to 8. At the same moment, 1, 4, 5 and 7 bind in behind 3 and 6 — on the opposition side — setting up exactly like they're about to drive 8 forward into contact. 3 and 6 haven't moved from where they were.",
    pos: {
      TH:[60,675], P1:[350,611], P4:[393,607], P3:[383,646], P8:[420,675], P6:[458,646], P5:[445,605], P7:[492,612],
      SH:[330,532], FH:[744,370], WNG:[150,370], CTR:[924,262]
    },
    ball:[250,675],
    arrow:{from:[60,675], to:[420,675]}
  },
  {
    title: "8 catches — 2 is already halfway to the 5m line",
    note: "Clean catch at the top. 1 and 4 are now in contact with 3; 5 and 7 are in contact with 6. There's a clear gap between 4 and 5 — that's where 8's pass to 2 will come through. 2 has already set off, halfway to the 5m line. 11 has set off too, already this far into his run.",
    pos: {
      TH:[150,651], P1:[340,622], P4:[385,610], P3:[370,648], P8:[420,675], P6:[470,648], P5:[455,610], P7:[500,622],
      SH:[330,532], FH:[744,370], WNG:[308,427], CTR:[924,262]
    },
    ball:[420,675],
    arrow:null
  },
  {
    title: "2 runs toward S5 — catches in line with 8",
    note: "The whole maul — 3, 6, 1, 4, 5, 7 — has driven 8 half a metre toward the opposition, who are pulled in tight to meet it. 2 draws level with 8 (infield alignment) and takes the pass through the gap. 11 has made it all the way to S4. 12 has set off too, level with 10.",
    pos: {
      TH:[420,600], P1:[340,640], P4:[385,628], P3:[370,666], P8:[420,693], P6:[470,666], P5:[455,628], P7:[500,640],
      SH:[330,532], FH:[744,370], WNG:[510,532], CTR:[900,370]
    },
    dpos: {
      X4:[420,733]
    },
    ball:[420,600],
    arrow:{from:[420,693], to:[420,600]}
  },
  {
    title: "2 cuts infield in line with 10 — 11 and 12 either side",
    note: "2 is a metre closer to the touchline than 10 now — no longer directly in line with him. 11 is 2m directly behind 2. 12 is 3m infield of 2 and 1m behind him. 9 has moved through to S5.",
    pos: {
      TH:[708,650], P1:[340,640], P4:[385,628], P3:[370,666], P8:[420,693], P6:[470,666], P5:[455,628], P7:[500,640],
      SH:[600,532], FH:[744,370], WNG:[708,578], CTR:[816,614]
    },
    dpos: {
      X4:[420,733]
    },
    ball:[744,650],
    arrow:null
  },
];

const svg = document.getElementById('pitch');
const attackG = document.getElementById('attack');
const defenseG = document.getElementById('defense');
const arrowsG = document.getElementById('arrows');
const ballEl = document.getElementById('ball');

function makePlayer(p, color, group, posMap){
  const g = document.createElementNS(NS,'g');
  g.setAttribute('id', 'player-'+p.id);
  const [x,y] = posMap[p.id];
  g.setAttribute('transform', `translate(${x},${y})`);
  g.style.transition = 'transform 0.7s cubic-bezier(.4,0,.2,1)';

  const circle = document.createElementNS(NS,'circle');
  circle.setAttribute('r', 19.5);
  circle.setAttribute('fill', color);
  circle.setAttribute('stroke', '#0f1b14');
  circle.setAttribute('stroke-width', 1.5);
  g.appendChild(circle);

  const text = document.createElementNS(NS,'text');
  text.setAttribute('text-anchor','middle');
  text.setAttribute('dy', 4);
  text.setAttribute('fill', '#f4f1ea');
  text.setAttribute('font-size', 15);
  text.setAttribute('font-weight', 800);
  text.textContent = p.label;
  g.appendChild(text);

  group.appendChild(g);
  return g;
}

// build defense (dimmer, but can react per-step via a step's optional dpos override)
const defenseEls = {};
defenseRoster.forEach(p=>{
  defenseEls[p.id] = makePlayer(p, 'var(--defense)', defenseG, defensePos);
});
defenseG.style.opacity = 0.55;

// build attack
const attackEls = {};
attackRoster.forEach(p=>{
  let color = 'var(--attack)';
  if(p.id==='SH'||p.id==='FH'||p.id==='TH'||p.id==='WNG'||p.id==='CTR') color = 'var(--attack-light)';
  if(p.id==='P8') color = 'var(--accent)';
  attackEls[p.id] = makePlayer(p, color, attackG, steps[0].pos);
});

function setStep(idx){
  const s = steps[idx];
  Object.keys(s.pos).forEach(id=>{
    const [x,y] = s.pos[id];
    if(attackEls[id]) attackEls[id].setAttribute('transform', `translate(${x},${y})`);
  });

  // Defense: use this step's dpos override if it has one, otherwise the standard position
  defenseRoster.forEach(p=>{
    const [x,y] = (s.dpos && s.dpos[p.id]) ? s.dpos[p.id] : defensePos[p.id];
    defenseEls[p.id].setAttribute('transform', `translate(${x},${y})`);
  });

  ballEl.style.transition = 'cx 0.7s cubic-bezier(.4,0,.2,1), cy 0.7s cubic-bezier(.4,0,.2,1)';
  ballEl.setAttribute('cx', s.ball[0]);
  ballEl.setAttribute('cy', s.ball[1]);

  arrowsG.innerHTML = '';
  if(s.arrow){
    const line = document.createElementNS(NS,'line');
    line.setAttribute('x1', s.arrow.from[0]);
    line.setAttribute('y1', s.arrow.from[1]);
    line.setAttribute('x2', s.arrow.to[0]);
    line.setAttribute('y2', s.arrow.to[1]);
    line.setAttribute('stroke', 'var(--accent)');
    line.setAttribute('stroke-width', 2);
    line.setAttribute('stroke-dasharray', '5 5');
    line.setAttribute('marker-end', 'url(#arrowhead)');
    line.setAttribute('opacity', 0.9);
    arrowsG.appendChild(line);
  }

  document.getElementById('step-num').textContent = `${idx+1}/${steps.length}`;
  document.getElementById('step-title').textContent = s.title;
  document.getElementById('step-note').textContent = s.note;

  document.querySelectorAll('.dot').forEach((d,i)=>d.classList.toggle('active', i===idx));

  document.getElementById('prev').disabled = idx===0;
  document.getElementById('next').disabled = idx===steps.length-1;
}

const defs = document.createElementNS(NS,'defs');
defs.innerHTML = `<marker id="arrowhead" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
  <path d="M0,0 L6,3 L0,6 Z" fill="var(--accent)"/>
</marker>`;
svg.insertBefore(defs, svg.firstChild);

const dotsWrap = document.getElementById('dots');
steps.forEach((s,i)=>{
  const dot = document.createElement('div');
  dot.className = 'dot' + (i===0?' active':'');
  dot.addEventListener('click', ()=>{ stopPlay(); current=i; setStep(i); });
  dotsWrap.appendChild(dot);
});

let current = 0;
let playing = false;
let playTimer = null;

function stopPlay(){
  playing = false;
  clearInterval(playTimer);
  document.getElementById('playpause').textContent = '▶ Play';
}

document.getElementById('prev').addEventListener('click', ()=>{
  stopPlay();
  if(current>0){ current--; setStep(current); }
});
document.getElementById('next').addEventListener('click', ()=>{
  stopPlay();
  if(current<steps.length-1){ current++; setStep(current); }
});
document.getElementById('reset').addEventListener('click', ()=>{
  stopPlay();
  current = 0;
  setStep(current);
});
document.getElementById('playpause').addEventListener('click', ()=>{
  if(playing){
    stopPlay();
  } else {
    playing = true;
    document.getElementById('playpause').textContent = '⏸ Pause';
    if(current===steps.length-1){ current=0; setStep(current); }
    playTimer = setInterval(()=>{
      if(current < steps.length-1){
        current++;
        setStep(current);
      } else {
        stopPlay();
      }
    }, 1600);
  }
});

setStep(0);
</script>
</body>
</html>
